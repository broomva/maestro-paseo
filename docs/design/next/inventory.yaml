    handler: plugin
    callers: [ui, conductor]
    code: [server/needs.ts, shared/needs.ts, index.server.ts]
  I-handled-list: { name: "handled.list", status: new, handler: plugin, callers: [ui], code: [server/needs.ts, shared/needs.ts, index.server.ts] }
  I-work-list: { name: "work.list", status: change, handler: plugin, callers: [ui, worker], code: [server/engine.ts, shared/contracts.ts] }
  I-work-get: { name: "work.get", status: keep, handler: plugin, callers: [ui, worker], code: [server/engine.ts] }
  I-work-history: { name: "work.history", status: keep, handler: plugin, callers: [ui], code: [server/records.ts] }
  I-work-files: { name: "work.files and work.file", status: keep, handler: plugin, callers: [ui], code: [server/records.ts] }
