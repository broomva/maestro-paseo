  C-settings-row: { name: "Settings row", status: new, pen: null, code: [client/settings.tsx] }
  C-toggle: { name: "Toggle", status: new, pen: null }
  C-lane-card: { name: "Lane card", status: new, pen: null }
  # The J/M kit (BRO-3034).
  C-inspector: { name: "Inspector (per-kind body; action bar frosted on desktop, solid on iOS)", status: new, pen: VbnhW }
  C-glance-tile: { name: "Glance tile", status: new, pen: oatDw }
  C-deck: { name: "Deck (phone; one hold at a time)", status: new, pen: null }
  C-pull-sheet: { name: "Pull-up sheet (phone; peeks from the bottom edge)", status: new, pen: null }
  C-tab-bar: { name: "Tab bar riding on the sheet (phone)", status: new, pen: P1PV0 }
  C-detail-header: { name: "Detail header (grabber, close, kind and place, more)", status: new, pen: Faf21 }
  C-swipe-row: { name: "Swipe row (right default, left Snooze or Open; never a hold)", status: new, pen: null }
  C-undo-toast: { name: "Undo toast (8 s)", status: new, pen: xuqvS }
  C-undertow: { name: "Undertow halo, tidepool dot and standing pulse (Running only)", status: new, pen: L4xCf4 }
  C-presence-menu: { name: "Presence menu", status: new, pen: kJOpv }

interfaces:
  # Reads. Pure: no write, no send, no create (BRO-2995).
  I-needs-list:
    name: needs.list(kind) — the one projection every count reads
    status: new
    handler: plugin
    callers: [ui, conductor]
    code: [server/attention.ts]
  I-handled-list: { name: "handled.list", status: new, handler: plugin, callers: [ui] }
  I-work-list: { name: "work.list", status: change, handler: plugin, callers: [ui, worker], code: [server/engine.ts, shared/contracts.ts] }
  I-work-get: { name: "work.get", status: keep, handler: plugin, callers: [ui, worker], code: [server/engine.ts] }
  I-work-history: { name: "work.history", status: keep, handler: plugin, callers: [ui], code: [server/records.ts] }
  I-work-files: { name: "work.files and work.file", status: keep, handler: plugin, callers: [ui], code: [server/records.ts] }
  I-work-for-agent: { name: "work.for-agent", status: keep, handler: plugin, callers: [ui, worker], code: [server/engine.ts] }
  I-asks-workspace: { name: "asks.workspace", status: keep, handler: plugin, callers: [ui], code: [server/control-home.ts] }
  I-fleet-get: { name: "fleet.get", status: keep, handler: plugin, callers: [ui], code: [server/fleet.ts] }
  I-fleet-tick: { name: "fleet.tick", status: keep, handler: plugin, callers: [ui], code: [server/fleet.ts] }
  I-timeline-get: { name: "timeline.get and timeline.log", status: keep, handler: plugin, callers: [ui], code: [server/timeline.ts] }
  I-loops-get: { name: "loops.get", status: change, handler: plugin, callers: [ui], code: [server/loops.ts] }
  I-initiatives-list: { name: "initiatives.list", status: keep, handler: plugin, callers: [ui], code: [server/initiatives.ts] }
  I-config-get: { name: "config.get", status: keep, handler: plugin, callers: [ui, worker], code: [server/config.ts] }
  I-folder-inspect: { name: "folder.inspect", status: keep, handler: plugin, callers: [ui], code: [server/folders.ts] }
  I-sweep-get: { name: "sweep.get (today loop.get)", status: change, handler: plugin, callers: [ui], code: [server/loop.ts] }
  I-lanes-get: { name: "lanes.get", status: new, handler: plugin, callers: [ui, conductor] }
  I-presence-get: { name: "presence.get", status: new, handler: plugin, callers: [ui, conductor] }
  I-policy-get: { name: "policy.get (policy.yaml and preauth, read only)", status: new, handler: plugin, callers: [ui] }
  I-notices-registry-get: { name: "notices.registry", status: new, handler: plugin, callers: [ui] }
  I-notices-list: { name: "notices.list (the Health deck: stuck, quiet, schedule, loop, initiative)", status: new, handler: plugin, callers: [ui, conductor] }
  I-answers-status: { name: "answers.status (waiting to land, routed, acted, held, recent)", status: new, handler: plugin, callers: [ui] }

  # Owner verbs. Each records a receipt and honours the undo window (BRO-2999).
  I-ask-answer:
    name: ask.answer
    status: keep
    handler: plugin
    callers: [ui]
    gate: owner
    stores: [S-ask-receipts, S-answers-branch]
    code: [server/control-home.ts, server/control-asks.ts]
  I-approval-decide:
    name: approval.decide (Allow or Deny, against the exact action)
    status: new
    handler: plugin
    callers: [ui]
    gate: owner
    stores: [S-ask-receipts]
  I-owner-step-done: { name: "owner_step.done", status: new, handler: plugin, callers: [ui], gate: owner, stores: [S-ask-receipts] }
  I-undo: { name: "work.undo (and every verb's undo)", status: change, handler: plugin, callers: [ui], gate: owner, stores: [S-work], code: [server/engine.ts] }
  I-verb-apply: { name: "apply a pending owner verb once its 8 s undo window passes (the owner already chose)", status: change, handler: plugin, callers: [plugin], stores: [S-work], code: [server/engine.ts] }
  I-work-unblock: { name: "work.unblock", status: change, handler: plugin, callers: [ui], gate: owner, stores: [S-work], code: [server/engine.ts] }
  I-work-cancel: { name: "work.cancel", status: keep, handler: plugin, callers: [ui], gate: owner, stores: [S-work], code: [server/engine.ts] }
  I-work-stop: { name: "work.stop", status: keep, handler: plugin, callers: [ui], gate: owner, stores: [S-work], code: [server/engine.ts] }
  I-notice-snooze: { name: "notice.snooze", status: new, handler: plugin, callers: [ui], gate: owner, stores: [S-notices-state] }
  I-config-set: { name: "config.set", status: change, handler: plugin, callers: [ui], gate: owner, stores: [S-config], code: [server/config.ts] }
  I-sweep-wake: { name: "sweep.wake (today loop.wake)", status: change, handler: plugin, callers: [ui, plugin], stores: [S-wake-log, S-work], code: [server/loop.ts] }
  I-presence-set: { name: "presence.set", status: new, handler: plugin, callers: [ui], gate: owner, stores: [S-presence] }
  I-session-prompt:
    name: session.prompt (Continue, Change course, Send a prompt; the conductor's auto-continue)
    status: change
    handler: plugin
    callers: [ui, conductor]
    code: [server/engine.ts]
    note: "Prompts an existing session; never creates one. A8 forbids creating work by rule; Continue is the owner's verb, auto-continue is A3."
  I-initiatives-file: { name: "initiatives.file", status: keep, handler: plugin, callers: [ui], gate: owner, stores: [S-work], code: [server/initiatives.ts] }

  # Work records. Queue only: launching is a lane's (A8).
  I-work-create: { name: "work.create (queues; no dispatch flag)", status: change, handler: plugin, callers: [ui, worker, lane], stores: [S-work], code: [server/engine.ts] }
  I-work-adopt: { name: "work.adopt (verified caller, BRO-2996)", status: change, handler: plugin, callers: [ui, worker], stores: [S-work], code: [server/engine.ts] }

  # The agent contract (C1): typed reaches, written through the ledger library.
  I-ask-raise: { name: "ask.raise", status: new, handler: bstack, callers: [worker, lane, bstack], stores: [S-asks-ledgers] }
  I-approval-request: { name: "approval.request", status: new, handler: bstack, callers: [worker, lane], stores: [S-asks-ledgers] }
  I-owner-step-raise: { name: "owner_step.raise", status: new, handler: bstack, callers: [worker, lane], stores: [S-asks-ledgers] }
  I-finished: { name: "finished", status: new, handler: bstack, callers: [worker], stores: [S-asks-ledgers] }
  I-proposal-file: { name: "proposal.file", status: new, handler: bstack, callers: [worker, lane, bstack], stores: [S-asks-ledgers] }
  I-ledger-answer: { name: "the ledger library's answer write (ask_ledger)", status: change, handler: bstack, callers: [plugin], stores: [S-asks-ledgers], code: [server/control-asks.ts] }

  # Notices.
  I-notice-raise: { name: "notice.raise", status: new, handler: plugin, callers: [worker, lane, bstack, plugin], stores: [S-notices-state] }
  I-notice-resolve: { name: "notice.resolve(key)", status: new, handler: plugin, callers: [plugin, lane, bstack], stores: [S-notices-state] }

  # The conductor's hands (D1).
  I-approval-apply: { name: "approval.apply (runs the allowed exact action)", status: new, handler: plugin, callers: [conductor] }
  I-answer-route: { name: "answer.route (to the asker, a sibling, the driver)", status: change, handler: plugin, callers: [conductor], stores: [S-ask-receipts], code: [server/answer-routes.ts] }
  I-answers-land: { name: "answers.land (one PR for maestro/answers)", status: change, handler: plugin, callers: [conductor], stores: [S-answers-branch], code: [server/answers-landing.ts] }
  I-ask-default: { name: "ask.default (a reversible ask takes its default after 30 min, A4)", status: new, handler: plugin, callers: [conductor], stores: [S-ask-receipts] }
  I-inbox-push: { name: "the inbox echo session that makes a push", status: change, handler: plugin, callers: [plugin], stores: [S-inbox], code: [server/inbox.ts] }
  I-paseo-events: { name: "Paseo hooks (turn started and ended, permission, archived)", status: keep, handler: plugin, callers: [paseo], code: [index.server.ts] }

  # Conductor and lanes.
  I-lane-report: { name: "lane.report", status: new, handler: conductor, callers: [lane], stores: [S-conductor-state] }
  I-conductor-log: { name: "the conductor's tick record and state.yaml", status: new, handler: conductor, callers: [conductor], stores: [S-conductor-state] }
  I-lane-assign: { name: "lane.assign", status: new, handler: lane, callers: [conductor], stores: [S-lane-state] }
  I-arc-launch: { name: "arc.launch (a profile and a brief)", status: new, handler: lane, callers: [lane], launches: true }
  I-conductor-wake: { name: "wake the conductor's heartbeat", status: new, handler: paseo, callers: [ui, plugin] }
  I-lane-tick-run: { name: "run a lane's tick now", status: new, handler: paseo, callers: [ui, conductor] }

  # bstack-owned writes, called through their CLIs or a PR (B2, B3, D4).
  I-fleet-mode-set: { name: "fleet mode and on/off (fleet CLI, launchctl)", status: new, handler: bstack, callers: [ui], gate: owner, stores: [S-fleet-config] }
  I-fleet-tick-run: { name: "run a fleet tick now", status: new, handler: bstack, callers: [ui, conductor], stores: [S-fleet-state] }
  I-fleet-ask-answer: { name: "answer a fleet ask through the fleet CLI", status: change, handler: bstack, callers: [ui], gate: owner, stores: [S-fleet-asks], code: [server/fleet.ts] }
  I-proposal-review: { name: "review a proposal through the fleet CLI", status: change, handler: bstack, callers: [ui], gate: owner, stores: [S-fleet-reviews], code: [server/fleet.ts] }
  I-loop-control: { name: "pause, resume, run a loop now", status: new, handler: bstack, callers: [ui], gate: owner, stores: [S-loop-ledger] }
  I-notices-registry-propose: { name: "propose a notices.yaml change (a PR)", status: new, handler: bstack, callers: [ui], gate: owner, stores: [S-notices-registry] }
  I-lanes-propose: { name: "propose a lanes.yaml change (a PR)", status: new, handler: bstack, callers: [ui], gate: owner, stores: [S-lanes] }
  I-drift-record: { name: "record a loop drift transition (pinned writer, BRO-3002)", status: change, handler: bstack, callers: [plugin], stores: [S-loop-drift], code: [server/loops.ts] }

  # Retired.
  I-work-dispatch: { name: "work.dispatch (the plugin starts a session)", status: retire, handler: plugin, callers: [ui, worker, plugin], launches: true, stores: [S-work], code: [server/engine.ts, server/runs.ts] }
  I-work-verdict: { name: "work.verdict approve, revise, block", status: retire, handler: plugin, callers: [ui], gate: owner, stores: [S-work], code: [server/engine.ts] }
  I-work-attention: { name: "work.attention (lists the client sums)", status: retire, handler: plugin, callers: [ui], code: [server/attention.ts] }

stores:
  S-config: { name: "~/.config/maestro-paseo/config.json", status: change, owner: plugin, modules: [server/config.ts], code: [server/config.ts] }
  S-work:
    name: <workRoot>/<item>/_work.md and _events.jsonl
    status: change
    owner: plugin
    modules: [server/store.ts]
    code: [server/store.ts]
  S-wake-log: { name: "~/.config/maestro-paseo/wake-log.jsonl", status: keep, owner: plugin, modules: [server/wake-log.ts], code: [server/wake-log.ts] }
  S-ask-receipts:
    name: ~/.local/state/maestro-paseo/asks.jsonl
    status: change
    owner: plugin
    modules: [server/control-asks.ts, server/answer-routes.ts]
    exception: two appenders on different in-process chains, no file lock, until BRO-2997
    code: [server/control-asks.ts, server/answer-routes.ts]
  S-answers-branch:
    name: the maestro/answers worktree and branch
    status: change
    owner: plugin
    modules: [server/control-home.ts, server/answers-landing.ts]
    exception: serialized in process only, until BRO-2997
    code: [server/control-home.ts, server/answers-landing.ts]
  S-asks-ledgers:
    name: <checkout>/.control/asks/*.yaml — asks, approvals, owner steps, finished, proposals
    status: change
    owner: bstack
    modules: [server/control-asks.ts, bstack ask_ledger.py]
    exception: Maestro writes answers itself instead of through the ledger library, until BRO-2997
    code: [server/control-asks.ts]
  S-notices-state: { name: "notice state (raised, snoozed, resolved by key)", status: new, owner: plugin }
  S-presence: { name: "owner presence (present, away, off)", status: new, owner: plugin }
  S-inbox: { name: "~/.config/maestro-paseo/inbox.json", status: change, owner: plugin, modules: [server/inbox.ts], code: [server/inbox.ts] }
  S-conductor-state: { name: "the conductor's state.yaml and ticks ledger", status: new, owner: conductor }
  S-lane-state: { name: "each lane's tick state and ledger", status: keep, owner: lane }
  S-lanes: { name: ".broomva/lanes.yaml", status: new, owner: bstack }
  S-notices-registry: { name: ".broomva/notices.yaml", status: new, owner: bstack }
  S-loop-ledger: { name: ".broomva/loops/*.yaml on origin/main", status: keep, owner: bstack, code: [server/loops-ledger.ts] }
  S-loop-drift: { name: "~/.broomva/ledger/loops/drift.jsonl", status: change, owner: bstack, modules: [server/loops.ts], code: [server/loops.ts] }
  S-fleet-config: { name: "~/.config/ctx/fleet.json and the launchd jobs", status: keep, owner: bstack, code: [server/fleet.ts] }
  S-fleet-state: { name: "~/.local/state/fleet-reconcile/<scope>/ (ledger, ticks, reports)", status: keep, owner: bstack, code: [server/fleet.ts] }
  S-fleet-asks:
    name: <fleet state>/.control/asks/*.yaml
    status: change
    owner: bstack
    modules: [server/fleet.ts, fleet-reconcile tick.sh]
    exception: Maestro writes the fleet's ledger directly, until BRO-2997
    code: [server/fleet.ts]
  S-fleet-reviews:
    name: <fleet state>/proposal-reviews.jsonl
    status: change
    owner: bstack
    modules: [server/fleet.ts]
    code: [server/fleet.ts]
  S-initiatives: { name: ".control/initiatives/*.yaml", status: keep, owner: bstack, code: [server/initiatives.ts] }
  S-p9: { name: "~/.config/broomva/p9 (CI waits)", status: keep, owner: bstack, code: [server/p9.ts] }
  S-launchd: { name: "~/Library/LaunchAgents plists and logs (read only)", status: keep, owner: bstack, code: [server/launchd.ts] }
  S-paseo-registry: { name: "Paseo agents, labels, timelines, schedules, heartbeats", status: keep, owner: paseo }

loops:
  L-conductor-tick:
    name: The conductor's tick — reconcile, sweep, allocate, govern, log; resume on events (D5)
    status: new
    scheduler: Paseo heartbeat maestro-conductor, every 15 min, woken by an answer, a death, a lane report or a merge (A7)
    owner: conductor
    calls: [I-needs-list, I-lanes-get, I-presence-get, I-lane-assign, I-approval-apply, I-answer-route, I-answers-land, I-ask-default, I-session-prompt, I-conductor-log, I-lane-tick-run]
  L-coordinator-tick:
    name: Broomva lane — bstack orchestrator-tick base + coordinator overlay (A11 pilot)
    status: keep
    scheduler: Paseo heartbeat coordinator-tick, every 2 h
    owner: lane
    calls: [I-lane-report, I-arc-launch, I-work-create, I-ask-raise, I-notice-raise]
  L-sri-tick:
    name: SRI lane — its own tick prompt until the 10-16 pilot check (BRO-2983)
    status: keep
    scheduler: Paseo heartbeat sri-coordinator-tick at :17 and :47
    owner: lane
    calls: [I-lane-report, I-arc-launch]
  L-fleet-reconcile:
    name: fleet-reconcile, one scope per job, dry run
    status: keep
    scheduler: launchd, hourly per scope
    owner: bstack
    calls: [I-fleet-tick-run, I-ask-raise, I-proposal-file]
  L-plugin-sweep:
    name: The plugin sweep — closes cards whose source resolved, records drift; never dispatches (A8)
    status: change
    scheduler: plugin timer (sweep minutes, off by default)
    owner: plugin
    calls: [I-sweep-wake, I-notice-resolve, I-drift-record]
    code: [server/loop.ts]
  L-undo-window:
    name: The 8 s undo timers that apply a pending owner verb (B4)
    status: keep
    scheduler: plugin timer, 8 s after the verb
    owner: plugin
    calls: [I-verb-apply]
    code: [shared/undo.ts, server/engine.ts]
  L-paseo-events:
    name: Paseo lifecycle hooks
    status: keep
    scheduler: Paseo events
    owner: plugin
    calls: [I-paseo-events]
    code: [index.server.ts]
  L-inbox-grace:
    name: The 15 min grace before an orchestrator's landing is pushed
    status: change
    scheduler: plugin timer, one shot
    owner: plugin
    calls: [I-inbox-push]
    code: [server/inbox.ts]
  L-client-query:
    name: The client's one subscription to needs.list and handled.list
    status: change
    scheduler: React Query, invalidated by plugin events
    owner: ui
    calls: [I-needs-list, I-handled-list]
    code: [client/hooks.ts, client/integrations.ts]
  L-loop-start-queued:
    name: Today's plugin loop step that starts queued work
    status: retire
    scheduler: plugin timer (loopMinutes)
    owner: plugin
    calls: [I-work-dispatch]
    code: [server/loop.ts]

findings:
  # Blockers: they break an owner answer.
  FND-plugin-launches:
    name: The plugin loop starts sessions (loop wake → startQueued → dispatch → agents.create), against A8
    severity: blocker
    state: open
    ticket: BRO-2990
    about: [L-loop-start-queued, I-work-dispatch, F-plugin-dispatch]
    code: [server/loop.ts:512, server/runs.ts:161]
  FND-routed-answer-runs:
    name: An answer filed as queued work with no hold is dispatched on the next wake (the 13b97ad9 burst)
    severity: blocker
    state: open
    ticket: BRO-2990
    about: [I-answer-route, F-answer-routing]
    code: [server/answer-routes.ts:563, server/loop.ts:512]

  FND-undo-ten-seconds:
    name: UNDO_MS is 10 s in the code; the owner set 8 s everywhere (B4)
    severity: minor
    state: fixed
    ticket: BRO-3032
    about: [F-undo, L-undo-window, I-undo]
    code: [shared/undo.ts]

  # Major: wiring that breaks a stated invariant.
  FND-reads-mutate:
    name: Polled reads write — work.list reconciles and sweeps, work.attention sweeps, loops.get records drift, a poll can open a session
    severity: major
    state: open
    ticket: BRO-2995
    about: [I-work-list, I-loops-get, I-work-attention]
    code: [server/engine.ts:605, server/loops.ts:588, server/inbox.ts:398]
  FND-self-close:
    name: A session can close its own gated work by printing ARC-STATUS and calling maestro ls
    severity: major
    state: open
    ticket: BRO-2996
    about: [I-work-list, F-agent-cli]
    code: [server/engine.ts:2149, server/events.ts:491]
  FND-socket-caller:
    name: The socket trusts a self-reported caller; adopt any session, dispatch any queued item
    severity: major
    state: open
    ticket: BRO-2996
    about: [I-work-adopt, I-work-create, P-cli]
    code: [server/agent-socket.ts:95, bin/maestro.ts:55]
  FND-agent-dispatch-policy:
    name: maestro dispatch from a session uses a weaker run policy than the loop
    severity: major
    state: open
    ticket: BRO-2996
    about: [I-work-dispatch]
    code: [server/engine.ts:343, server/runs.ts:101]
  FND-client-counts:
    name: The client sums six lists into the count, and three surfaces disagree (Fleet band omits loops)
    severity: major
    state: open
    ticket: BRO-3001
    about: [I-needs-list, F-header-counts, P-header]
    code: [client/header-count.ts:36, client/fleet-cockpit-model.ts:318, client/plane-model.ts:55]
  FND-permission-bypass:
    name: Allow and Deny call Paseo straight from the client in two copied handlers; the engine learns late
    severity: major
    state: open
    ticket: BRO-2999
    about: [I-approval-decide, P-approval-card]
    code: [client/detail.tsx:318, client/gate-card.tsx:256]
  FND-approve-on-work:
    name: The gate card and the detail pane still offer Approve on work
    severity: major
    state: open
    ticket: BRO-2999
    about: [F-approve-work, I-work-verdict, P-approval-card]
    code: [client/gate-card.tsx:187, server/engine.ts:954]
  FND-no-undo:
    name: Stop, cancel, unblock, answer, review and config.set apply at once, with no undo
    severity: major
    state: open
    ticket: BRO-2999
    about: [I-work-stop, I-work-cancel, I-ask-answer, I-config-set, F-undo]
    code: [server/engine.ts:1474, index.server.ts]
  FND-multi-writer-stores:
    name: asks.jsonl, the answers branch, the ask ledgers and the fleet's ledgers each have two writer modules
    severity: major
    state: open
    ticket: BRO-2997
    about: [S-ask-receipts, S-answers-branch, S-asks-ledgers, S-fleet-asks]
    code: [server/control-asks.ts:882, server/answer-routes.ts:755, server/answers-landing.ts:331]
  FND-work-lock:
    name: The work store has only an in-memory lock; two daemons on one workRoot race
    severity: major
    state: open
    ticket: BRO-2997
    about: [S-work]
    code: [server/store.ts:46, server/store.ts:252]
  FND-writes-fleet-state:
    name: Maestro writes fleet-reconcile's ledgers and reviews directly
    severity: major
    state: open
    ticket: BRO-2997
    about: [S-fleet-asks, S-fleet-reviews, I-fleet-ask-answer, I-proposal-review]
    code: [server/fleet.ts:893, server/fleet.ts:975]
  FND-live-script:
    name: The daemon pipes origin/main:scripts/broomva_home.py into python3 on drift writes
    severity: major
