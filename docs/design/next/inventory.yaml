loops:
  L-conductor-tick:
    name: The conductor's tick — reconcile, sweep, allocate, govern, log; resume on events (D5)
    status: new
    scheduler: Paseo heartbeat maestro-conductor, every 15 min, woken by an answer, a death, a lane report or a merge (A7)
    owner: conductor
    calls: [I-needs-list, I-lanes-get, I-presence-get, I-lane-assign, I-approval-apply, I-answer-route, I-answers-land, I-ask-default, I-session-prompt, I-conductor-log, I-lane-tick-run]
  L-coordinator-tick:
    name: Broomva lane — bstack orchestrator-tick base + coordinator overlay (A11 pilot)
    status: keep
    scheduler: Paseo heartbeat coordinator-tick, every 2 h
    owner: lane
    calls: [I-lane-report, I-arc-launch, I-work-create, I-ask-raise, I-notice-raise]
  L-sri-tick:
    name: SRI lane — its own tick prompt until the 10-16 pilot check (BRO-2983)
    status: keep
    scheduler: Paseo heartbeat sri-coordinator-tick at :17 and :47
    owner: lane
    calls: [I-lane-report, I-arc-launch]
  L-fleet-reconcile:
    name: fleet-reconcile, one scope per job, dry run
    status: keep
    scheduler: launchd, hourly per scope
    owner: bstack
    calls: [I-fleet-tick-run, I-ask-raise, I-proposal-file]
  L-plugin-sweep:
    name: The plugin sweep — keeps cards true to their source (reconcile), applies due decisions, records drift; never dispatches (A8)
    status: change
    scheduler: plugin timer, every 30 s while the plugin runs (MAESTRO_PASEO_SWEEP_SECONDS), apart from the loop's period; one at a time under a lease; the loop's wake (I-sweep-wake) runs one first
    owner: plugin
    calls: [I-verb-apply, I-notice-resolve, I-drift-record]
    code: [server/sweep.ts, server/engine.ts, server/loops.ts, index.server.ts]
    note: "BRO-2995: the one place outside a hook or a verb where the plugin writes on its own. Reads (work.list, work.attention, loops.get and the views they reach) write nothing; what they did on the side (reconcile, due decisions, drift, the asks' and ledger's fetch, leftover locks) runs here. Its period is not the loop's: with the loop off (the default) the cards still stay true."
  L-undo-window:
    name: The 8 s undo timers that apply a pending owner verb (B4)
    status: keep
    scheduler: plugin timer, 8 s after the verb (the ledger's, and the gate decision's own)
    owner: plugin
    calls: [I-verb-apply]
    code: [shared/undo.ts, server/engine.ts, server/owner-verbs.ts]
  L-paseo-events:
    name: Paseo lifecycle hooks
    status: keep
    scheduler: Paseo events
    owner: plugin
    calls: [I-paseo-events]
    code: [index.server.ts]
  L-inbox-grace:
    name: The 15 min grace before an orchestrator's landing is pushed
    status: change
    scheduler: plugin timer, one shot
    owner: plugin
    calls: [I-inbox-push]
    code: [server/inbox.ts]
  L-client-query:
    name: The client's one subscription to needs.list and handled.list
    status: change
    scheduler: React Query, invalidated by plugin events
    owner: ui
    calls: [I-needs-list, I-handled-list]
    code: [client/hooks.ts, client/integrations.ts, client/needs-bus.ts]
  L-loop-start-queued:
    name: Today's plugin loop step that starts queued work
    status: retire
    scheduler: plugin timer (loopMinutes)
    owner: plugin
    calls: [I-work-dispatch]
    code: [server/loop.ts]

findings:
  # Blockers: they break an owner answer.
  FND-plugin-launches:
    name: The plugin loop starts sessions (loop wake → startQueued → dispatch → agents.create), against A8
    severity: blocker
    state: fixed
    ticket: BRO-2990
    about: [L-loop-start-queued, I-work-dispatch, F-plugin-dispatch]
    code: [server/loop.ts, server/engine.ts]
    note: "The loop has no start step and is typed against an engine with no dispatch (LoopEngine); Engine.dispatch refuses actor maestro outright (NEVER_BY_RULE). The cap counts running, waiting-on-permission, stuck and starting runs; a session's run takes its lane profile's mode and never starts in Always ask."
  FND-routed-answer-runs:
    name: An answer filed as queued work with no hold is dispatched on the next wake (the 13b97ad9 burst)
    severity: blocker
    state: fixed
    ticket: BRO-2990
    about: [I-answer-route, F-answer-routing]
    code: [server/answer-routes.ts, server/a8-never-starts.test.ts]
    note: "An answer no session can take is a lane.assign candidate for the conductor on its ask.routed receipt, never queued work; Decisions shows it waiting for the conductor. server/a8-never-starts.test.ts replays 13b97ad9."

  FND-undo-ten-seconds:
    name: UNDO_MS was 10 s in the code; the owner set 8 s everywhere (B4), now shared/undo.ts
    severity: minor
    state: fixed
    ticket: BRO-3032
    about: [F-undo, L-undo-window, I-undo]
    code: [shared/undo.ts]

  # Major: wiring that breaks a stated invariant.
  FND-reads-mutate:
    name: Polled reads write — work.list reconciles and sweeps, work.attention sweeps, loops.get records drift, a poll can open a session
    severity: major
    state: fixed
    ticket: BRO-2995
    about: [I-work-list, I-loops-get, I-work-attention, L-plugin-sweep]
    code: [server/engine.ts, server/loops.ts, server/sweep.ts, index.reads.test.ts]
    note: "Reads are queries: Engine.list, Loops.get, WorkspaceAsks.read and Fleet.get write nothing and fetch nothing, and a handler only keeps the client. Reconcile, due decisions, drift, the fetches and the lock sweep moved into the plugin sweep (L-plugin-sweep). index.reads.test.ts polls the three reads 50 times through the plugin's handlers with a spy on Paseo's client and a fingerprint of every file, and is mutation-proven (a write put back into any read fails it)."
  FND-self-close:
    name: A session can close its own gated work by printing ARC-STATUS and calling maestro ls
    severity: major
    state: fixed
    ticket: BRO-2996
    about: [I-work-list, F-agent-cli]
    code: [server/engine.ts, server/events.ts]
    note: "finishedArc and adopterClosed are gone: a session's own ARC-STATUS DONE, CLOSED or MERGED, its archive, and the archive of the orchestrator that tracked it close nothing, so its work waits at your gate with a note that its session is gone (engine.test.ts 'what a session says of itself never closes its gated work'; agent-socket.test.ts 'a child cannot close its own work ... spoofed or not'). Paseo's archive hook does not say who archived, so no archive can be an owner's verdict. Work reaches done only by a gate (a PR merged through the repo's merge gates, or gate:auto checks) or the owner's verdict; a merged branch closes a Stuck adopted arc as Done with the PR and merge commit on the receipt (branch-merge.test.ts, engine.test.ts), and a session that tracked itself and archives itself stays Stuck rather than canceled."
  FND-socket-caller:
    name: The socket trusts a self-reported caller; adopt any session, dispatch any queued item
    severity: major
    state: fixed
    ticket: BRO-2996
    about: [I-work-adopt, I-work-create, P-cli]
    code: [server/agent-socket.ts, server/callers.ts, bin/maestro.ts]
    note: "Every verb that writes checks its caller against Paseo's registry plus a client-supplied folder (not peer credentials): the agent exists, is live, and the shell is in its folder. It acts only for that session, or one it started by Paseo's own record; approval.request and approval.withdraw are the verified session's own; work.dispatch left the socket; a caller naming no session may only queue work, held for the owner (origin marked external). Residual (BRO-3086): a process of yours that reads the registry and sends a live session's id and folder is taken for it; it still cannot close or start work."
  FND-agent-dispatch-policy:
    name: maestro dispatch from a session uses a weaker run policy than the loop
    severity: major
    state: fixed
    ticket: BRO-2996
    about: [I-work-dispatch]
    code: [server/engine.ts, server/runs.ts]
    note: "There is no session dispatch to hold to a policy: work.dispatch and create-with-dispatch left the socket, the engine refuses any start that is not yours, and the lane-profile path that only a session's start used is deleted."
  FND-client-counts:
    name: The client sums six lists into the count, and three surfaces disagree (Fleet band omits loops)
    severity: major
    state: fixed
    ticket: BRO-3001
    about: [I-needs-list, F-header-counts, P-header]
    code: [server/needs.ts, client/header-count.ts, client/hooks.ts]
    note: "needs.list is computed once on the server; the header, the tabs, the Feed's Needs you, the Fleet band and the push read it, and server/needs-invariant.test.ts holds them equal."
  FND-permission-bypass:
    name: Allow and Deny call Paseo straight from the client in two copied handlers; the engine learns late
    severity: major
    state: fixed
    ticket: BRO-2999
    about: [I-approval-decide, P-approval-card]
    code: [client/no-direct-permission.test.ts, server/engine.ts, server/verb-specs.ts]
    note: "Allow and Deny are approval.decide: recorded, applied 8 s later by the engine (Engine.answerPermission), receipted. client/no-direct-permission.test.ts fails on any client file that answers a prompt on Paseo itself."
  FND-approve-on-work:
    name: The gate card and the detail pane still offer Approve on work
    severity: major
    state: fixed
    ticket: BRO-2999
    about: [F-approve-work, I-work-verdict, P-approval-card]
    code: [server/engine.ts, client/session-card.tsx, client/detail.tsx]
    note: "work.verdict approve throws APPROVE_RETIRED; the cards offer Change course and Cancel work. Gap: with approve gone nothing closes plain human-gate work whose branch merged (BRO-3076)."
  FND-no-undo:
    name: Stop, cancel, unblock, answer, review and config.set apply at once, with no undo
    severity: major
    state: fixed
    ticket: BRO-2999
    about: [I-work-stop, I-work-cancel, I-ask-answer, I-config-set, F-undo]
    code: [server/owner-verbs.ts, server/verb-specs.ts, index.server.ts]
    note: "Every verb listed in F-undo waits 8 s in the ledger with a receipt and an Undo; server/work-verbs.test.ts, server/owner-verbs.test.ts and index.server.test.ts prove each window."
  FND-usage-limit-lands-finished:
    name: A turn that ended on a usage limit landed at the gate as finished; "Close it as done" would have closed unfinished work (6 of 10 live approvals, 2026-10-10)
    severity: major
    state: fixed
    ticket: BRO-3073
    about: [I-work-unblock, F-health-notices]
    code: [server/usage-limit.ts, server/engine.ts, shared/paused.ts, server/usage-limit.test.ts]
    note: "Such a turn (the message, or a provider's rate-limit or credit error) records the work Stuck, 'Paused: hit a usage limit; resumes after <reset>', its session alive and holding its slot; its card offers Resume (Unblock). The sweep moves work already at the gate on one, once. Nothing closes it by itself. A login that expired (Failed to authenticate, Not logged in) or an organization that disabled the subscription is a pause too, so a fleet-wide login expiry is counted, not quiet. A paused run whose session is gone says Resume starts a fresh run. The reset stays text (BRO-3081)."
  FND-multi-writer-stores:
    name: asks.jsonl, the answers branch, the ask ledgers and the fleet's ledgers each have two writer modules
    severity: major
    state: fixed
    ticket: BRO-2997
    about: [S-ask-receipts, S-answers-branch, S-asks-ledgers, S-fleet-asks]
    code: [server/ask-receipts.ts, server/answers-branch.ts, server/control-asks.ts, server/fleet-reviews.ts]
    note: "One writer module each, a file lock held across processes under all of them, and scripts/inventory-check.ts fails a server file that writes without being named a store's writer."
  FND-work-lock:
    name: The work store has only an in-memory lock; two daemons on one workRoot race
    severity: major
    state: fixed
    ticket: BRO-2997
    about: [S-work]
    code: [server/store.ts, server/locks.ts]
  FND-writes-fleet-state:
    name: Maestro writes fleet-reconcile's ledgers and reviews directly
    severity: major
    state: open
    ticket: BRO-3098
    about: [S-fleet-asks, S-fleet-reviews, I-fleet-ask-answer, I-proposal-review]
    code: [server/fleet.ts, server/fleet-reviews.ts, server/control-asks.ts]
    note: "BRO-2997 narrowed it to one guarded writer for each file (a lock shared with the fleet's own writers, a guarded append); the fleet CLI has no answer or review verb, so Maestro still writes them. BRO-3098 asks for the verbs."
  FND-live-script:
