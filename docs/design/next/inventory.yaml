  I-asks-workspace: { name: "asks.workspace", status: keep, handler: plugin, callers: [ui], code: [server/control-home.ts] }
  I-fleet-get: { name: "fleet.get", status: keep, handler: plugin, callers: [ui], code: [server/fleet.ts] }
  I-fleet-tick: { name: "fleet.tick", status: keep, handler: plugin, callers: [ui], code: [server/fleet.ts] }
  I-kit-gallery: { name: "kit.gallery — whether the daemon turned the component gallery on (BRO-3034)", status: new, handler: plugin, callers: [ui], code: [shared/kit.ts, index.server.ts] }
  I-timeline-get: { name: "timeline.get and timeline.log", status: keep, handler: plugin, callers: [ui], code: [server/timeline.ts] }
  I-loops-get: { name: "loops.get", status: change, handler: plugin, callers: [ui], code: [server/loops.ts] }
  I-initiatives-list: { name: "initiatives.list", status: keep, handler: plugin, callers: [ui], code: [server/initiatives.ts] }
  I-config-get: { name: "config.get", status: keep, handler: plugin, callers: [ui, worker], code: [server/config.ts] }
  I-folder-inspect: { name: "folder.inspect", status: keep, handler: plugin, callers: [ui], code: [server/folders.ts] }
  I-sweep-get: { name: "sweep.get (today loop.get)", status: change, handler: plugin, callers: [ui], code: [server/loop.ts] }
  I-lanes-get: { name: "lanes.get", status: new, handler: plugin, callers: [ui, conductor] }
  I-presence-get: { name: "presence.get", status: new, handler: plugin, callers: [ui, conductor] }
  I-policy-get: { name: "policy.get (policy.yaml and preauth, read only)", status: new, handler: plugin, callers: [ui] }
  I-notices-registry-get: { name: "notices.registry", status: new, handler: plugin, callers: [ui] }
  I-notices-list: { name: "notices.list (the Health deck: stuck, quiet, schedule, loop, initiative; a pure read)", status: new, handler: plugin, callers: [ui, conductor], code: [server/notices.ts, shared/notices.ts] }
  I-answers-status: { name: "answers.status (waiting to land, routed, acted, held, recent)", status: new, handler: plugin, callers: [ui], code: [server/answers-status.ts] }

  # Owner verbs. Each records a receipt and honours the undo window (BRO-2999).
  I-ask-answer:
    name: ask.answer
    status: keep
    handler: plugin
    callers: [ui]
    gate: owner
    stores: [S-ask-receipts, S-answers-branch]
    code: [server/control-home.ts, server/control-asks.ts, server/answers-branch.ts]
  I-approval-decide:
    name: approval.decide (Allow or Deny, against the exact action)
    status: new
    handler: plugin
    callers: [ui]
    gate: owner
    stores: [S-verbs, S-approvals, S-work]
    code: [server/verb-specs.ts, server/owner-verbs.ts, server/engine.ts]
    note: "Binds to the exact action text (a permission prompt's title and detail, or a request's action @ ref). Recorded now, applied 8 s later: the engine answers the held prompt (Engine.answerPermission) or tells the requesting session. A prompt that changed in the window drops the decision, with its reason in the receipt."
  I-owner-step-done: { name: "owner_step.done", status: new, handler: plugin, callers: [ui], gate: owner, stores: [S-ask-receipts] }
  I-undo: { name: "verb.undo (any ledger verb or gate decision, by receipt) and work.undo", status: change, handler: plugin, callers: [ui], gate: owner, stores: [S-work, S-verbs], code: [server/engine.ts, server/owner-verbs.ts, index.server.ts] }
  I-verbs-list: { name: "verbs.list (what waits to take effect, and what settled in the last day)", status: new, handler: plugin, callers: [ui], stores: [S-verbs, S-work], code: [server/owner-verbs.ts, index.server.ts] }
  I-verb-apply: { name: "apply a pending owner verb once its 8 s undo window passes (the owner already chose)", status: change, handler: plugin, callers: [plugin], stores: [S-work, S-verbs], code: [server/engine.ts, server/owner-verbs.ts] }
  I-work-unblock: { name: "work.unblock (8 s undo; Resume for work paused on a usage limit)", status: change, handler: plugin, callers: [ui], gate: owner, stores: [S-work, S-verbs], code: [server/engine.ts, server/verb-specs.ts] }
  I-work-cancel: { name: "work.cancel (8 s undo; at your gate it is a decision with its own window)", status: change, handler: plugin, callers: [ui], gate: owner, stores: [S-work, S-verbs], code: [server/engine.ts, server/verb-specs.ts] }
  I-work-stop: { name: "work.stop (8 s undo; the not-committed check is at the call and again when it applies)", status: change, handler: plugin, callers: [ui], gate: owner, stores: [S-work, S-verbs], code: [server/engine.ts, server/verb-specs.ts] }
  I-notice-snooze: { name: "notice.snooze", status: new, handler: plugin, callers: [ui], gate: owner, stores: [S-notices-state], code: [server/notice-snoozes.ts] }
  I-initiatives-review: { name: "initiatives.review (a due review answered: a receipt in the asks log, 8 s undo; never edits an initiative file)", status: new, handler: plugin, callers: [ui], gate: owner, stores: [S-ask-receipts], code: [server/reviews.ts] }
  I-config-set: { name: "config.set (saved 8 s later; a newer save replaces a waiting one)", status: change, handler: plugin, callers: [ui], gate: owner, stores: [S-config, S-verbs], code: [server/config.ts, index.server.ts] }
  I-sweep-wake: { name: "sweep.wake (today loop.wake)", status: change, handler: plugin, callers: [ui, plugin], stores: [S-wake-log, S-work], code: [server/loop.ts] }
  I-presence-set: { name: "presence.set", status: new, handler: plugin, callers: [ui], gate: owner, stores: [S-presence] }
  I-session-prompt:
    name: session.prompt (Continue, Change course, Send a prompt; the conductor's auto-continue)
    status: change
    handler: plugin
    callers: [ui, conductor]
    stores: [S-verbs]
    code: [server/verb-specs.ts, server/owner-verbs.ts]
    note: "Prompts an existing session; never creates one. A8 forbids creating work by rule; Continue is the owner's verb, auto-continue is A3."
  I-initiatives-file: { name: "initiatives.file", status: keep, handler: plugin, callers: [ui], gate: owner, stores: [S-work], code: [server/initiatives.ts] }

  # Work records. Queue only: launching is a lane's (A8).
  I-work-create: { name: "work.create (queues; no dispatch flag)", status: change, handler: plugin, callers: [ui, worker, lane], stores: [S-work], code: [server/engine.ts] }
  I-work-adopt: { name: "work.adopt (verified caller, BRO-2996)", status: change, handler: plugin, callers: [ui, worker], stores: [S-work], code: [server/engine.ts, server/agent-socket.ts, server/callers.ts] }

  # The agent contract (C1): typed reaches, written through the ledger library.
  I-ask-raise: { name: "ask.raise", status: new, handler: bstack, callers: [worker, lane, bstack], stores: [S-asks-ledgers] }
  I-approval-request: { name: "approval.request (and approval.withdraw): a session asks leave for one exact action; only the owner decides", status: new, handler: plugin, callers: [worker, lane], stores: [S-approvals], code: [server/approvals.ts, server/agent-socket.ts, bin/maestro.ts] }
  I-owner-step-raise: { name: "owner_step.raise", status: new, handler: bstack, callers: [worker, lane], stores: [S-asks-ledgers] }
  I-finished: { name: "finished", status: new, handler: bstack, callers: [worker], stores: [S-asks-ledgers] }
  I-proposal-file: { name: "proposal.file", status: new, handler: bstack, callers: [worker, lane, bstack], stores: [S-asks-ledgers] }
  I-ledger-answer: { name: "the ledger library's answer write (ask_ledger)", status: change, handler: bstack, callers: [plugin], stores: [S-asks-ledgers], code: [server/control-asks.ts] }

  # Notices.
  I-notice-raise: { name: "notice.raise", status: new, handler: plugin, callers: [worker, lane, bstack, plugin], stores: [S-notices-state] }
  I-notice-resolve: { name: "notice.resolve(key)", status: new, handler: plugin, callers: [plugin, lane, bstack], stores: [S-notices-state] }

  # The conductor's hands (D1).
  I-approval-apply: { name: "approval.apply (runs the allowed exact action)", status: new, handler: plugin, callers: [conductor], note: "Not built: BRO-2999 tells the requesting session its answer (approval.decide); a session or the conductor runs what was allowed." }
  I-answer-route: { name: "answer.route (to the asker, a sibling, the driver; else a lane.assign candidate for the conductor)", status: change, handler: plugin, callers: [conductor], stores: [S-ask-receipts], code: [server/answer-routes.ts] }
  I-conductor-decide: { name: "conductor.decide and conductor.undo (file an answer that waits for the conductor as queued work, or dismiss it; 8 s undo)", status: new, handler: plugin, callers: [ui], gate: owner, stores: [S-ask-receipts, S-work], code: [server/answer-routes.ts, client/conductor-answers.tsx] }
  I-answers-land: { name: "answers.land (one PR for maestro/answers)", status: change, handler: plugin, callers: [conductor], stores: [S-answers-branch, S-answers-landing], code: [server/answers-landing.ts] }
  I-ask-default: { name: "ask.default (a reversible ask takes its default after 30 min, A4)", status: new, handler: plugin, callers: [conductor], stores: [S-ask-receipts] }
  I-inbox-push: { name: "the inbox echo session that makes a push", status: change, handler: plugin, callers: [plugin], stores: [S-inbox], code: [server/inbox.ts] }
  I-paseo-events: { name: "Paseo hooks (turn started and ended, permission, archived)", status: keep, handler: plugin, callers: [paseo], code: [index.server.ts] }

  # Conductor and lanes.
  I-lane-report: { name: "lane.report", status: new, handler: conductor, callers: [lane], stores: [S-conductor-state] }
  I-conductor-log: { name: "the conductor's tick record and state.yaml", status: new, handler: conductor, callers: [conductor], stores: [S-conductor-state] }
  I-lane-assign: { name: "lane.assign", status: new, handler: lane, callers: [conductor], stores: [S-lane-state] }
  I-arc-launch: { name: "arc.launch (a profile and a brief)", status: new, handler: lane, callers: [lane], launches: true }
  I-conductor-wake: { name: "wake the conductor's heartbeat", status: new, handler: paseo, callers: [ui, plugin] }
  I-lane-tick-run: { name: "run a lane's tick now", status: new, handler: paseo, callers: [ui, conductor] }

  # bstack-owned writes, called through their CLIs or a PR (B2, B3, D4).
  I-fleet-mode-set: { name: "fleet mode and on/off (fleet CLI, launchctl)", status: new, handler: bstack, callers: [ui], gate: owner, stores: [S-fleet-config] }
  I-fleet-tick-run: { name: "run a fleet tick now", status: new, handler: bstack, callers: [ui, conductor], stores: [S-fleet-state] }
  I-fleet-ask-answer: { name: "answer a fleet ask through the fleet CLI", status: change, handler: bstack, callers: [ui], gate: owner, stores: [S-fleet-asks], code: [server/fleet.ts] }
  I-proposal-review: { name: "review a proposal through the fleet CLI", status: change, handler: bstack, callers: [ui], gate: owner, stores: [S-fleet-reviews], code: [server/fleet.ts] }
  I-loop-control: { name: "pause, resume, run a loop now", status: new, handler: bstack, callers: [ui], gate: owner, stores: [S-loop-ledger] }
  I-notices-registry-propose: { name: "propose a notices.yaml change (a PR)", status: new, handler: bstack, callers: [ui], gate: owner, stores: [S-notices-registry] }
  I-lanes-propose: { name: "propose a lanes.yaml change (a PR)", status: new, handler: bstack, callers: [ui], gate: owner, stores: [S-lanes] }
  I-drift-record: { name: "record a loop drift transition (pinned writer, BRO-3002)", status: change, handler: bstack, callers: [plugin], stores: [S-loop-drift], code: [server/loops.ts] }

  # Retired.
  I-work-dispatch: { name: "work.dispatch (the plugin starts a session; your Dispatch is the one start left, and it left the agent socket, BRO-2996)", status: retire, handler: plugin, callers: [ui, lane], launches: true, stores: [S-work], code: [server/engine.ts, server/runs.ts] }
  I-work-verdict: { name: "work.verdict approve (refused), revise (Change course), block (Cancel work)", status: retire, handler: plugin, callers: [ui], gate: owner, stores: [S-work], code: [server/engine.ts] }
  I-work-attention: { name: "work.attention (the watched notices and the pills' sessions; no count reads it since BRO-3001)", status: retire, handler: plugin, callers: [ui], code: [server/attention.ts] }

stores:
  S-config: { name: "~/.config/maestro-paseo/config.json", status: change, owner: plugin, modules: [server/config.ts], code: [server/config.ts] }
  S-work:
    name: <workRoot>/<item>/_work.md and _events.jsonl
    status: change
    owner: plugin
    modules: [server/store.ts]
    code: [server/store.ts, server/locks.ts, server/atomic.ts, server/jsonl.ts]
    note: "BRO-2997: one lock per item id, a file lock in <workRoot>/.locks (server/locks.ts), so a second daemon on the same root waits its turn; _work.md replaced through a temp file and a rename, the first one included; events appended whole under the lock, a torn last line repaired. The in-memory Map is gone."
  S-wake-log: { name: "~/.config/maestro-paseo/wake-log.jsonl", status: keep, owner: plugin, modules: [server/wake-log.ts], code: [server/wake-log.ts] }
  S-ask-receipts:
    name: ~/.local/state/maestro-paseo/asks.jsonl
    status: change
    owner: plugin
    modules: [server/ask-receipts.ts]
    code: [server/ask-receipts.ts, server/control-asks.ts, server/answer-routes.ts, server/reviews.ts, server/jsonl.ts]
    note: "BRO-2997: every receipt line (an answer's, what became of it, a review's) is appended through server/ask-receipts.ts, which takes the file's lock, so two daemons never interleave a line."
  S-answers-branch:
    name: the maestro/answers worktree and branch
    status: change
    owner: plugin
    modules: [server/answers-branch.ts]
    code: [server/answers-branch.ts, server/control-home.ts, server/answers-landing.ts]
    note: "BRO-2997: the worktree and the branch change only in server/answers-branch.ts (make, bring up to main, commit, merge, reset, push), every change under one lock held across processes. control-home.ts commits through it and answers-landing.ts lands through it; neither runs a git command that writes."
  S-answers-landing:
    name: "~/.local/state/maestro-paseo/answers-landing.json: where the batch stands (stage, PR, conflict)"
    status: keep
    owner: plugin
    modules: [server/answers-landing.ts]
    code: [server/answers-landing.ts]
  S-asks-ledgers:
    name: <checkout>/.control/asks/*.yaml — asks, approvals, owner steps, finished, proposals
    status: change
    owner: bstack
    modules: [server/control-asks.ts]
    code: [server/control-asks.ts, server/locks.ts]
    note: "BRO-2997: Maestro's one writer of an ask ledger is control-asks.ts, under the §5.5 lock it shares with bstack's ask_ledger.py (server/locks.ts), a temp file renamed over the ledger. The library's own write is bstack's; Maestro still edits the answer's bytes itself until the ask CLI has an answer verb (BRO-3098)."
  S-verbs: { name: "~/.local/state/maestro-paseo/verbs.jsonl (the owner-verb ledger: pending, undone, applied, dropped)", status: new, owner: plugin, modules: [server/owner-verbs.ts], code: [server/owner-verbs.ts] }
  S-approvals: { name: "~/.local/state/maestro-paseo/approvals.jsonl (approval.request and what became of each)", status: new, owner: plugin, modules: [server/approvals.ts], code: [server/approvals.ts] }
