    code: [client/detail.tsx, client/files.tsx]
  F-undo:
    name: An 8 s undo on every owner verb that changes state (B4)
    status: change
    kind: control
    pages: [P-briefing, P-approval-card, P-feed, P-decisions, P-work, P-health, P-initiatives, P-phone, P-settings-sweep-fleet, P-settings-loops-notices-approvals, P-settings-lanes, P-presence]
    interfaces: [I-undo, I-verbs-list]
    code: [shared/undo.ts, shared/verbs.ts, server/owner-verbs.ts, server/verb-specs.ts, server/engine.ts, client/pending-verbs.tsx]
    note: "BRO-2999: one ledger (server/owner-verbs.ts) holds every owner verb that changes state: approval.decide, session.prompt, work.cancel (queued or stuck), work.stop, work.unblock, work.leave-running, ask.answer, fleet.review, config.set, loop.wake. Each answers { receipt, appliesAt }, applies 8 s later, is checked again when it applies, leaves a receipt, and verb.undo takes any of them back. A decision at the gate (revise, cancel at review) keeps its own window on the work's events and is listed beside them."

