    interfaces: [I-presence-set, I-presence-get]
  F-auto-continue:
    name: A reversible next step continues after 10 min when present, at once when off (A3)
    status: new
    kind: orchestrate
    answers: [A3]
    pages: []
    interfaces: [I-session-prompt]
  F-answer-routing:
