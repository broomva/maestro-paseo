# Maestro next: the inventory. BRO-2994.
#
# Every feature, page, component, interface, store and loop of Maestro next. Each one has an id,
# a status against today's code, and the edges that wire it. scripts/inventory-check.ts checks the
# structure on every `bun test` (CI):
#   - each feature reaches a page or a loop and has an interface;
#   - each page has a frame, and a live page points at the chosen series (J desktop, M phone,
#     K session cards, P presence, B/D settings), never an S, V, H or G reference export;
#   - only the owner calls a gate verb;
#   - only the conductor or a lane launches a session (A8);
#   - every store is written by its owning layer through one module, unless a ticket says otherwise;
#   - every finding above minor has a ticket.
#
# status: keep (exists, stays) · change (exists, the design changes it) · new · retire
# layers: owner · ui (Maestro surface) · plugin (Maestro server) · conductor (Maestro as a Paseo session)
#         · lane (a lane orchestrator: Broomva coordinator, SRI) · worker (an arc session)
#         · bstack (fleet-reconcile, ledgers, CLIs, policy) · paseo (daemon, app, push)
# frame: a node id in docs/design/maestro-next.pen; `today` keeps a surface undrawn, tracked by a finding.
# phone_frame / phone_png: the M (iPhone) frame and its export, when the page has one.
# code: today's files, from the code inventory of maestro-paseo 3f8d9d8 (four read-only passes, 10-09).

version: 1

features:
  # The three holds: the only things that put a session in Needs you (A1, A0).
  F-need-ask:
    name: Ask — a question the session cannot settle; Answer, Skip, or the timed default
    status: change
    kind: need
    answers: [A1, A4, A6]
    pages: [P-feed, P-briefing, P-decisions, P-phone]
    interfaces: [I-ask-raise, I-needs-list, I-ask-answer, I-ledger-answer, I-ask-default, I-answer-route]
    code: [client/decision-card.tsx, server/control-asks.ts]
  F-need-approval:
    name: Approval — one exact action a policy layer held; Allow, Deny or Chat in place
    status: new
    kind: need
    answers: [A1, A2]
    pages: [P-feed, P-approval-card, P-briefing, P-phone]
    interfaces: [I-approval-request, I-needs-list, I-approval-decide, I-undo, I-approval-apply]
    code: [client/gate-card.tsx]
  F-need-owner-step:
    name: Owner step — something only the owner can do (a login, a key, a sudo); Done or Not now
    status: new
    kind: need
    answers: [A1]
    pages: [P-feed]
    interfaces: [I-owner-step-raise, I-needs-list, I-owner-step-done]

  # Watched: shown, never blocking.
  F-finished:
    name: Finished — what an arc landed; Continue or Change course
    status: new
    kind: watch
    pages: [P-feed]
    interfaces: [I-finished, I-handled-list, I-session-prompt]
    code: [client/arc-report.tsx]
  F-health-notices:
    name: Health — a fact with evidence that closes itself; Unblock, Snooze, Open log
    status: change
    kind: watch
    answers: [A6]
    pages: [P-feed, P-health, P-briefing]
    interfaces: [I-notice-raise, I-notice-resolve, I-notice-snooze, I-work-unblock]
    code: [client/fleet-queue.tsx, client/plane.tsx]
  F-proposals-digest:
    name: Proposals — what agents suggest the fleet learn, reviewed weekly
    status: change
    kind: watch
    pages: [P-feed]
    interfaces: [I-proposal-file, I-proposal-review]
    code: [client/fleet-queue.tsx]
  F-handled-for-you:
    name: Handled for you — what closed without the owner, and why
    status: new
    kind: watch
    pages: [P-feed]
    interfaces: [I-handled-list]
  F-work-board:
    name: Work — running, queued, done, and history, in one place
    status: change
    kind: watch
    pages: [P-work, P-feed]
    interfaces: [I-work-list, I-work-get, I-work-history, I-work-cancel, I-work-stop]
    code: [client/plane-views.tsx, client/history.tsx]
  F-header-counts:
    name: One count by kind in the header, the tabs, the pill and the push
    status: change
    kind: watch
    pages: [P-header]
    interfaces: [I-needs-list]
    code: [client/header-count.ts, client/integrations.ts]
  F-briefing:
    name: Briefing — an item opened beside the Feed, with its evidence and its verbs
    status: change
    kind: watch
    pages: [P-briefing]
    interfaces: [I-work-get, I-work-files]
    code: [client/detail.tsx, client/files.tsx]
  F-undo:
    name: An 8 s undo on every owner verb that changes state (B4)
    status: change
    kind: control
    pages: [P-briefing, P-approval-card, P-feed, P-decisions, P-work, P-health, P-initiatives, P-phone, P-settings-sweep-fleet, P-settings-loops-notices-approvals, P-settings-lanes, P-presence]
    interfaces: [I-undo]
    code: [shared/undo.ts, server/engine.ts]

  # Doing.
  F-new-work:
    name: New work — the composer queues it; the conductor gives it to a lane (A8)
    status: change
    kind: create
    answers: [A8]
    pages: [P-new-work]
    interfaces: [I-work-create, I-folder-inspect, I-config-get]
    code: [client/new-work.tsx]
  F-decisions-triage:
