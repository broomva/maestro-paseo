name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx biome ci .
      # The suites commit on scratch repos (the answers batch); a hosted runner has no git identity of its own.
      - run: |
          git config --global user.name "maestro-ci"
          git config --global user.email "maestro-ci@users.noreply.github.com"
      # 30 s timeout: git-heavy suites need headroom under load
      - run: bun test --timeout 30000
