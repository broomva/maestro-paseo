name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job runs on the owner's Mac (BRO-3056): GitHub will not start hosted jobs
# while the account's Actions billing is blocked, and the owner chose local
# runners over adding budget (2026-10-10). The pool is registered with
# `CI_RUNNER_REPO=broomva/maestro-paseo … scripts/ci-runner.sh start` in
# broomva/workspace (label `maestro-local`; docs/references/local-ci-runner.md).
# Going back to hosted runners is only `runs-on: ubuntu-latest`.
jobs:
  check:
    runs-on: [self-hosted, maestro-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx biome ci .
      - run: bun test
